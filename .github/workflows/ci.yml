name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: torogoz-tech/d_rocket_engine_sqlite
          ref: main
          path: .ci/deps/d_rocket_engine_sqlite
      - uses: actions/checkout@v4
        with:
          repository: torogoz-tech/d_rocket_builder
          ref: main
          path: .ci/deps/d_rocket_builder
      - uses: actions/checkout@v4
        with:
          repository: torogoz-tech/d_rocket_lints
          ref: main
          path: .ci/deps/d_rocket_lints
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure local package overrides
        run: |
          printf '%s\n' \
            'dependency_overrides:' \
            '  d_rocket_engine_sqlite:' \
            '    path: .ci/deps/d_rocket_engine_sqlite' \
            '  d_rocket_builder:' \
            '    path: .ci/deps/d_rocket_builder' \
            '  d_rocket_lints:' \
            '    path: .ci/deps/d_rocket_lints' > pubspec_overrides.yaml
      - run: flutter pub get
      - name: Generate source files
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Validate generated Dart
        run: dart run tool/verify_generated.dart
      - run: dart analyze
      - run: dart test --reporter=expanded

  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: torogoz-tech/d_rocket_engine_sqlite
          ref: main
          path: .ci/deps/d_rocket_engine_sqlite
      - uses: actions/checkout@v4
        with:
          repository: torogoz-tech/d_rocket_builder
          ref: main
          path: .ci/deps/d_rocket_builder
      - uses: actions/checkout@v4
        with:
          repository: torogoz-tech/d_rocket_lints
          ref: main
          path: .ci/deps/d_rocket_lints
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Verify tag and package version
        run: |
          test "$(sed -n 's/^version: *//p' pubspec.yaml | head -1)" = "${GITHUB_REF#refs/tags/v}"
      - name: Configure local package overrides
        run: |
          printf '%s\n' \
            'dependency_overrides:' \
            '  d_rocket_engine_sqlite:' \
            '    path: .ci/deps/d_rocket_engine_sqlite' \
            '  d_rocket_builder:' \
            '    path: .ci/deps/d_rocket_builder' \
            '  d_rocket_lints:' \
            '    path: .ci/deps/d_rocket_lints' > pubspec_overrides.yaml
      - run: flutter pub get
      - name: Generate source files
        run: dart run build_runner build --delete-conflicting-outputs
      - run: dart pub publish --dry-run
